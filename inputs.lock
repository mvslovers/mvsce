# Every external input of the build: one [[input]] per file.
#
# label   groups the files of one published version. Jay Moseley replaces
#         his files in place under the same URL, so a version is named here,
#         by us: jay-v<guide>-<yyyy-mm of the objects>. A changed file is a
#         new label with new entries; existing entries are never edited.
# md5     as Jay states it on the prerequisites page, checked as well.
#
# config/sysgen.toml selects the label a build uses.

