name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sysgen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build environment (Hercules)
        uses: docker/build-push-action@v6
        with:
          context: container
          load: true
          tags: mvsce-build:ci
          cache-from: type=gha,scope=mvsce-build
          cache-to: type=gha,mode=max,scope=mvsce-build

      # Jay Moseley's files are fetched once per inputs.lock, not per run.
      - name: Input cache
        uses: actions/cache@v4
        with:
          path: cache/inputs
          key: inputs-${{ hashFiles('inputs.lock') }}

      - name: Build
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src mvsce-build:ci \
            ./sysgen build --no-cache

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build/logs/
          if-no-files-found: ignore
